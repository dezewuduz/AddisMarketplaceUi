<div class="hero">
  <div class="hero-inner">
    <div>
      <div class="hero-eyebrow">
        <span class="dot"></span>
        <span class="eyebrow">ገበያ ላይ ይግቡ</span>
      </div>
      <h1 class="hero-title">ያለ ኪራይ ሱቅ ክፈት፣<br><em>የትም</em> ገበያ ውጣ።</h1>
      <p class="hero-desc">ማንኛውም ነጋዴ ፎቶ፣ ዋጋ እና መግለጫ ብቻ ለጥፎ በደቂቃዎች ውስጥ ይሸጣል። ገዥዎችም በአንድ ገጽ ላይ ሁሉንም ሱቆች እያመዛዘኑ ትክክለኛውን ያገኛሉ።</p>

      <div class="search-bar">
        <input type="text" placeholder="ምን ይፈልጋሉ? ለምሳሌ 'ወንድ ጃኬት'" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" />
        <button (click)="onSearch()">ፈልግ</button>
      </div>

      <div class="hero-cta">
        <button class="btn btn-solid" (click)="modalState.openLogin()">እንደ ገዥ ግባ</button>
        <button class="btn" (click)="modalState.openRegister()">እንደ ሻጭ ተመዝገብ</button>
      </div>
    </div>

    <div class="stall-map">
      <div class="stall-grid">
        @for (stall of stalls; track stall.num) {
          <div
            class="stall"
            [class.active]="filterService.selectedCategory() === stall.category"
            (click)="onStallClick(stall.category)">
            <span class="num">{{ stall.num }}</span>{{ stall.label }}
          </div>
        }
      </div>
    </div>
  </div>
</div>
