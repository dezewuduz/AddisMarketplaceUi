@if (isOpen()) {
  <div class="modal-overlay" (click)="close()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      @if (successMessage()) {
        <h3>✅ Success</h3>
        <p class="success">{{ successMessage() }}</p>
        <button class="btn btn-solid" (click)="close()">Close</button>
      } @else {
        <h3>Place Order</h3>
        <p class="product-summary">{{ product?.name }} — {{ product?.price }} Birr</p>

        <form (ngSubmit)="onSubmit()">
          <label>Your Name</label>
          <input type="text" [(ngModel)]="buyerName" name="buyerName" required />

          <label>Your Phone Number</label>
          <input type="text" [(ngModel)]="buyerPhone" name="buyerPhone" required placeholder="0911223344" />

          <label>Quantity</label>
          <input type="number" [(ngModel)]="quantity" name="quantity" min="1" required />

          @if (errorMessage()) {
            <p class="error">{{ errorMessage() }}</p>
          }

          <button type="submit" class="btn btn-solid" [disabled]="submitting()">
            {{ submitting() ? 'Sending...' : 'Confirm Order' }}
          </button>
        </form>
      }
      <button class="close-btn" (click)="close()">✕</button>
    </div>
  </div>
}
