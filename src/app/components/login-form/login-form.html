@if (modalState.loginOpen()) {
  <div class="modal-overlay" (click)="close()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <h3>ግባ</h3>
      <form (ngSubmit)="onSubmit()">
        <label>ስልክ ቁጥር</label>
        <input type="text" [(ngModel)]="form.phoneNumber" name="phoneNumber" required placeholder="0911223344" />

        <label>የይለፍ ቃል</label>
        <input type="password" [(ngModel)]="form.password" name="password" required />

        @if (errorMessage) {
          <p class="error">{{ errorMessage }}</p>
        }

        <button type="submit" class="btn btn-solid">ግባ</button>
      </form>
      <button class="close-btn" (click)="close()">✕</button>
    </div>
  </div>
}
