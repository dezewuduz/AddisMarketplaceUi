<header>
  <div class="logo">
<img src="Addis1.jpg" alt="AddisMarketPlace" class="Addis1-img" />
    <div>
      <div class="logo-text">Gebeya<span class="dot">.</span></div>
      <div class="logo-sub">Anything, Any Seller</div>
    </div>
  </div>
  <nav>
    <a routerLink="/">Go to Market</a>
    <a (click)="scrollToProducts()">Categories</a>
    <a routerLink="/buyer-guide">About Us</a>
    <a (click)="onSellersClick()">For Sellers</a>
  </nav>
  <div class="header-actions">
    @if (authService.isLoggedIn()) {
      <a routerLink="/dashboard" class="welcome-text">👋 {{ authService.sellerName() }}</a>
      <button class="btn" (click)="authService.logout()">Logout</button>
    } @else {
      <button class="btn" (click)="modalState.openLogin()">Login</button>
      <button class="btn btn-berbere" (click)="modalState.openRegister()">Open Shop</button>
    }
  </div>
</header>

<app-login-form></app-login-form>
<app-register-form></app-register-form>
