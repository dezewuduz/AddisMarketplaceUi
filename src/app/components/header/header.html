<header>
  <div class="logo">
    <div class="logo-mark">ገ</div>
    <div>
      <div class="logo-text">ገበያ<span class="dot">.</span></div>
      <div class="logo-sub">ማንኛውም ነገር፣ ማንኛውም ሻጭ</div>
    </div>
  </div>
  <nav>
    <a>ገበያ ላይ ይግቡ</a>
    <a>ምድቦች</a>
    <a>ስለ እኛ</a>
    <a>ለሻጮች</a>
  </nav>
  <div class="header-actions">
    @if (authService.isLoggedIn()) {
      <a routerLink="/dashboard" class="welcome-text">👋 {{ authService.sellerName() }}</a>
      <button class="btn" (click)="authService.logout()">ውጣ</button>
    } @else {
      <button class="btn" (click)="loginForm.open()">ግባ</button>
      <button class="btn btn-berbere" (click)="registerForm.open()">ሱቅ ክፈት</button>
    }
  </div>
</header>

<app-login-form #loginForm></app-login-form>
<app-register-form #registerForm></app-register-form>
